name: Build

on:
  # Manual trigger: go to the Actions tab -> Build -> "Run workflow".
  workflow_dispatch: {}
  # Also builds automatically when you push a version tag, e.g.:
  #   git tag v1.2.0 && git push --tags
  # Tagging is itself a deliberate action, so this doesn't fire on your
  # regular day-to-day commits to main - only when you decide a version
  # is ready.
  push:
    tags: ["v*"]

# If you trigger the workflow twice in a row before the first finishes,
# cancel the older run instead of burning minutes on both.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags, so `git describe` below can name the version.
          fetch-depth: 0

      # The version baked into the app (Help section, window title, .exe
      # Properties, Info.plist) - the tag itself on a release build, or
      # e.g. v1.3.4-2-gabc1234 for a manual run between tags. Passed into
      # the Docker build as a build arg, since .git isn't in its context.
      - name: Determine version
        run: echo "APP_VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo 0.0.0-dev)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build appimage builder image
        uses: docker/build-push-action@v6
        env:
          # v6+ auto-uploads a "build record" artifact, which breaks
          # actions/download-artifact in the release job (see
          # https://github.com/docker/build-push-action/issues/1167).
          # We don't need the record, so turn it off entirely.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: packaging/docker/Dockerfile.appimage
          tags: 3dco-appimage-builder:latest
          load: true
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=appimage
          cache-to: type=gha,mode=max,scope=appimage

      - name: Run build (produces AppImage)
        run: |
          mkdir -p dist/linux
          docker run --rm -v "${{ github.workspace }}/dist:/dist" 3dco-appimage-builder:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dco-linux-appimage
          path: dist/linux/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows executable
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags, so `git describe` below can name the version.
          fetch-depth: 0

      # The version baked into the app (Help section, window title, .exe
      # Properties, Info.plist) - the tag itself on a release build, or
      # e.g. v1.3.4-2-gabc1234 for a manual run between tags. Passed into
      # the Docker build as a build arg, since .git isn't in its context.
      - name: Determine version
        run: echo "APP_VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo 0.0.0-dev)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build windows builder image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: packaging/docker/Dockerfile.windows
          tags: 3dco-windows-builder:latest
          load: true
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=windows
          cache-to: type=gha,mode=max,scope=windows

      - name: Run build (produces .exe)
        run: |
          mkdir -p dist/windows
          docker run --rm -v "${{ github.workspace }}/dist:/dist" 3dco-windows-builder:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dco-windows
          path: dist/windows/3dco+.exe
          if-no-files-found: error

      # 3dco+.debug (produced alongside 3dco+.exe - see Dockerfile.windows)
      # holds this exact build's debug symbols, split out of the shipped
      # .exe to keep it small. Uploaded as its own artifact here, and
      # attached to the release below as a separate, clearly-labeled
      # asset - not merged into the 3dco-windows artifact above, so a
      # normal user downloading the .exe never sees or needs it. warn
      # (not error) if it's missing: the Dockerfile's own fallback
      # still ships a working, unstripped .exe with debug info embedded
      # if objcopy couldn't be found, just without a separate .debug -
      # that's a degraded-but-fine build, not something this workflow
      # should fail over.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: 3dco-windows-debug-symbols
          path: dist/windows/3dco+.debug
          if-no-files-found: warn

  macos:
    name: macOS Universal App
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags, so `git describe` below can name the version.
          fetch-depth: 0

      # The version baked into the app (Help section, window title, .exe
      # Properties, Info.plist) - the tag itself on a release build, or
      # e.g. v1.3.4-2-gabc1234 for a manual run between tags. Passed into
      # the Docker build as a build arg, since .git isn't in its context.
      - name: Determine version
        run: echo "APP_VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo 0.0.0-dev)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build macos builder image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: packaging/docker/Dockerfile.macos
          tags: 3dco-macos-builder:latest
          load: true
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=macos
          cache-to: type=gha,mode=max,scope=macos

      - name: Run build (produces .app bundle)
        run: |
          mkdir -p dist/macos
          docker run --rm -v "${{ github.workspace }}/dist:/dist" 3dco-macos-builder:latest

      # GitHub Release assets must be single files - a raw .app bundle is a
      # directory, so it can't be attached directly in the release job below.
      # Zip it here (once, on the same runner that just built it) instead of
      # re-deriving the app name later.
      - name: Zip macOS app bundle
        run: |
          cd dist/macos
          zip -r "3dco+-macos.zip" "3dco+.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3dco-macos
          path: dist/macos/3dco+-macos.zip
          if-no-files-found: error

  # Only runs when you push a version tag (e.g. `git tag v1.2.0 && git push --tags`).
  # Bundles all three platform builds into a single GitHub Release.
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only needed for release-notes/ (see "Find release notes" below).
      # Must run before the artifact download: checkout cleans the
      # workspace.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # `pattern` takes a single glob, not a list of names - this matches
          # our four build artifacts (3dco-linux-appimage, 3dco-windows,
          # 3dco-windows-debug-symbols, 3dco-macos) and nothing else.
          pattern: 3dco-*
          merge-multiple: false

      # release-notes/<tag>.md (e.g. release-notes/v1.3.4.md), if
      # committed before tagging, becomes the release description - the
      # same file the app embeds for its own "What's New" dialog.
      - name: Find release notes
        id: notes
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "No $f - release will have no description"; fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          # By default this action fails the whole step if any one
          # files: entry matches nothing. The debug symbols entry below
          # legitimately can be absent - Dockerfile.windows's own
          # fallback still ships a working .exe (just unstripped, with
          # debug info embedded rather than split out) if objcopy
          # couldn't be found - and that's a degraded-but-fine build,
          # not something that should block the other three, guaranteed
          # -to-exist platform assets from being released.
          fail_on_unmatched_files: false
          files: |
            release-assets/3dco-linux-appimage/*.AppImage
            release-assets/3dco-windows/3dco+.exe
            release-assets/3dco-windows-debug-symbols/3dco+.debug
            release-assets/3dco-macos/3dco+-macos.zip
